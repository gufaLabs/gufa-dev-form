<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>gufa.Labs — It's a time machine!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #e8e4e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Lora', Georgia, serif;
      padding: 24px 16px 48px;
    }

    /* Amber topbar */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 5px;
      background: linear-gradient(90deg, #c8922a 0%, #e8b84b 50%, #c8922a 100%);
      z-index: 100;
    }

    /* Card */
    .card {
      background: #fafaf8;
      border-radius: 16px;
      padding: 48px 36px 44px;
      max-width: 420px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      box-shadow: 0 2px 24px rgba(0,0,0,0.07);
    }

    /* Logo */
    .logo-wrap {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      overflow: hidden;
      background: #f0ece8;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Tagline */
    .tagline {
      font-family: 'Lora', Georgia, serif;
      font-size: 15px;
      color: #7a6f65;
      letter-spacing: 0.01em;
      margin-bottom: 36px;
      text-align: center;
    }

    .tagline sup {
      font-size: 9px;
      vertical-align: super;
      letter-spacing: 0.05em;
      color: #c8922a;
      font-weight: 500;
    }

    /* Buttons */
    .btn-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px 20px;
      border-radius: 10px;
      text-align: center;
      font-family: 'Lora', Georgia, serif;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      transition: opacity 0.15s ease, transform 0.1s ease;
      cursor: pointer;
      letter-spacing: 0.01em;
    }

    .btn:hover {
      opacity: 0.88;
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0px);
      opacity: 1;
    }

    /* Primary — amber */
    .btn-primary {
      background: linear-gradient(135deg, #c8922a 0%, #e8b84b 100%);
      color: #fff;
    }

    /* Secondary — outlined warm */
    .btn-secondary {
      background: transparent;
      border: 1.5px solid #c8c2bb;
      color: #4a4139;
    }

    .btn-secondary:hover {
      border-color: #c8922a;
      color: #c8922a;
    }
  </style>
</head>
<body>
  <div class="topbar"></div>

  <div class="card">
    <div class="logo-wrap">
      <img src="gufaLogoMess.png" alt="gufa.Labs" />
    </div>

    <p class="tagline">It's a time machine!<sup>TM</sup></p>

    <div class="btn-stack">
      <a href="gufa-says-hello.html" class="btn btn-primary">Drop your rolls!</a>
      <a href="https://www.instagram.com/gufa.labs/" target="_blank" rel="noopener" class="btn btn-secondary">Checkout gufa's Instagram!</a>
      <a href="https://wa.me/918160392774?text=Hey%20gufa,%0A%0A" target="_blank" rel="noopener" class="btn btn-secondary">Talk with us?</a>
    </div>
  </div>
</body>
</html>
