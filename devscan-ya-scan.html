<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>gufa.Labs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #dedad5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gufa-wrap {
      min-height: 600px;
      width: 100%;
      max-width: 560px;
      background: #dedad5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      padding: 4rem 2rem;
    }

    .gufa-wordmark {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 20px;
      letter-spacing: 0.3em;
      color: #6b5a3e;
      margin-bottom: 2.5rem;
      position: relative;
    }

    .gufa-question {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 17px;
      color: #2a2218;
      letter-spacing: 0.04em;
      margin-bottom: 3rem;
      text-align: center;
      text-shadow: 0 0 12px rgba(180,140,80,0.15);
      position: relative;
      line-height: 1.6;
      max-width: 320px;
    }

    .gufa-buttons {
      display: flex;
      flex-direction: column;
      gap: 0;
      width: 100%;
      max-width: 340px;
      position: relative;
    }

    .gufa-btn {
      background: transparent;
      border: 0.5px solid #c8b89a;
      color: #5a4a32;
      font-family: 'Lora', serif;
      font-style: italic;
      font-size: 16px;
      letter-spacing: 0.05em;
      padding: 1.2rem 1.5rem;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: block;
      line-height: 1.4;
      transition: border-color 0.35s, color 0.35s, background 0.35s;
    }

    .gufa-btn + .gufa-btn { border-top: none; }

    .gufa-btn:hover {
      border-color: #c8922a;
      color: #2a2218;
      background: rgba(180,140,80,0.08);
    }

    .btn-eyebrow {
      font-family: 'Lora', serif;
      font-style: normal;
      font-size: 9px;
      letter-spacing: 0.35em;
      color: #a89880;
      text-transform: uppercase;
      display: block;
      margin-bottom: 0.4rem;
      transition: color 0.35s;
    }

    .gufa-btn:hover .btn-eyebrow { color: #7a6040; }

    .gufa-sep {
      width: 0.5px;
      height: 20px;
      background: #c8b89a;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div class="gufa-wrap">
<div class="gufa-wordmark">gufa.Labs</div>
    <div class="gufa-question" id="gufaQuestion"></div>

    <div class="gufa-buttons">
      <a class="gufa-btn" id="devScanBtn" href="#">
        <span class="btn-eyebrow">develop</span>
        I want to process my film!
      </a>
      <div class="gufa-sep"></div>
      <a class="gufa-btn" id="scanOnlyBtn" href="#">
        <span class="btn-eyebrow">scan only</span>
        I only need to scan my negatives.
      </a>
    </div>
  </div>

  <script>
    const lines = [
      "How shall gufa enrich you today, {name}?",
      "Hey {name}, what would you like to do at gufa today?",
      "Hey {name}, what can gufa do for you today?",
      "In the many adventures of {name}, what wish has brought you to gufa today?",
      "gufa remembers you, {name} — what brings you back today?",
      "The darkroom is ready, {name} — what are we bringing to light today?",
      "{name}, the chemicals are warm — what are we developing today?",
      "Every roll has a story, {name}, and a name — what's next?"
    ];

    const params   = new URLSearchParams(window.location.search);
    const sname    = params.get('name') || params.get('sname') || 'explorer';
    const snum     = params.get('snum') || '';
    const picked   = lines[Math.floor(Math.random() * lines.length)];

    document.getElementById('gufaQuestion').textContent = picked.replace(/{name}/g, sname);

    // Build query string carrying snum and sname forward
    const forward = new URLSearchParams();
    if (snum)  forward.set('snum',  snum);
    if (sname !== 'explorer') forward.set('sname', sname);
    const q = forward.toString() ? '?' + forward.toString() : '';

    document.getElementById('devScanBtn').href =
      'https://gufalabs.github.io/gufa-dev-form/film-nanny-log.html' + q;

    document.getElementById('scanOnlyBtn').href =
      'https://tally.so/r/44jv65' + q;
  </script>
</body>
</html>
