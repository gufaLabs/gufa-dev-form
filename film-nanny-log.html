<html lang="en">
<head>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #dedad5;
      --amber: #c8922a;
      --amber-dim: #9a6e2a;
      --amber-glow: #c8922a33;
      --text: #2a2218;
      --text-dim: #7a6040;
      --surface: #f0ece8;
      --border: #c8b89a;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Instrument Serif', Georgia, serif;
      overflow-x: hidden;
    }


    .stage {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem 5rem;
    }

    .eyebrow {
      font-family: 'Instrument Serif', Georgia, serif;
      font-style: italic;
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      color: var(--amber-dim);
      text-transform: lowercase;
      margin-bottom: 2.4rem;
      opacity: 0.8;
    }

    .headline {
      font-family: 'Instrument Serif', Georgia, serif;
      font-style: italic;
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      color: var(--text);
      text-align: center;
      line-height: 1.3;
      margin-bottom: 0.5rem;
      letter-spacing: 0.01em;
      transition: opacity 0.3s;
    }

    .subline {
      font-family: 'Instrument Serif', Georgia, serif;
      font-style: italic;
      font-size: 0.85rem;
      color: var(--text-dim);
      text-align: center;
      margin-bottom: 2.4rem;
    }

    /* ── film count ── */
    .count-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.8rem;
    }

    .count-input {
      width: 80px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 0.7rem 1rem;
      color: var(--text);
      font-family: 'Instrument Serif', Georgia, serif;
      font-style: italic;
      font-size: 1.6rem;
      letter-spacing: 0.08em;
      text-align: center;
      outline: none;
      caret-color: var(--amber);
      transition: border-color 0.2s, box-shadow 0.2s;
      -moz-appearance: textfield;
    }

    .count-input::-webkit-outer-spin-button,
    .count-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

    .count-input:focus {
      border-color: var(--amber-dim);
      box-shadow: 0 0 0 3px var(--amber-glow);
    }

    .count-nudge {
      font-family: 'Instrument Serif', Georgia, serif;
      font-style: italic;
      font-size: 0.82rem;
      color: var(--amber-dim);
      text-align: center;
      max-width: 340px;
      line-height: 1.6;
      opacity: 0;
      transition: opacity 0.4s;
      min-height: 1rem;
    }

    .count-nudge.visible { opacity: 1; }

    /* ── film position indicator ── */
    .film-pos {
      font-family: 'Instrument Serif', Georgia, serif;
      font-style: italic;
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      color: var(--amber-dim);
      margin-bottom: 2rem;
      opacity: 0.7;
    }

    /* ── search ── */
    .search-wrap {
      position: relative;
      width: 100%;
      max-width: 440px;
    }

    .search-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 1rem 1.2rem;
      color: var(--text);
      font-family: 'Lora', Georgia, serif;
      font-style: italic;
      font-size: 1.05rem;
      letter-spacing: 0.02em;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      caret-color: var(--amber);
    }

    .search-input::placeholder {
      color: var(--text-dim);
      font-style: italic;
    }

    .search-input:focus {
      border-color: var(--amber-dim);
      box-shadow: 0 0 0 3px var(--amber-glow);
    }

    /* ── dropdown ── */
    .dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: #fafaf8;
      border: 1px solid var(--border);
      border-radius: 2px;
      max-height: 260px;
      overflow-y: auto;
      z-index: 100;
      display: none;
      scrollbar-width: thin;
      scrollbar-color: var(--amber-dim) transparent;
    }

    .dropdown.open { display: block; }

    .dropdown-item {
      padding: 0.75rem 1.2rem;
      cursor: pointer;
      font-family: 'Lora', Georgia, serif;
      font-style: italic;
      font-size: 0.95rem;
      color: #5a4a32;
      border-bottom: 1px solid #1e1a16;
      transition: background 0.12s, color 0.12s;
    }

    .dropdown-item:last-child { border-bottom: none; }

    .dropdown-item:hover,
    .dropdown-item.active {
      background: #f0ece8;
      color: #2a2218;
    }

    .dropdown-item.gufa-item { color: var(--amber-dim); }
    .dropdown-item.gufa-item:hover,
    .dropdown-item.gufa-item.active {
      color: var(--amber);
      background: #1e1a10;
    }

    .match-highlight { color: var(--amber); font-style: italic; }

    .dropdown-item.fallback-item {
      border-top: 1px solid #2a2420;
      color: var(--text-dim);
      font-size: 0.85rem;
      opacity: 0.7;
    }

    .dropdown-item.fallback-item:hover,
    .dropdown-item.fallback-item.active {
      opacity: 1;
      color: var(--text);
      background: #1a1612;
    }

    /* ── selected badge ── */
    .selected-badge {
      margin-top: 1rem;
      font-family: 'Lora', Georgia, serif;
      font-style: italic;
      font-size: 0.85rem;
      color: var(--amber-dim);
      text-align: center;
      min-height: 1.4rem;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .selected-badge.visible { opacity: 1; }

    /* ── continue ── */
    .continue-btn {
      margin-top: 1.2rem;
      padding: 0.85rem 2.8rem;
      background: transparent;
      border: 1px solid var(--amber-dim);
      color: var(--amber);
      font-family: 'Instrument Serif', Georgia, serif;
      font-style: italic;
      font-size: 1rem;
      letter-spacing: 0.08em;
      cursor: pointer;
      border-radius: 2px;
      transition: background 0.2s, box-shadow 0.2s, color 0.2s, opacity 0.3s;
      opacity: 0;
      pointer-events: none;
    }

    .continue-btn.ready {
      opacity: 1;
      pointer-events: all;
    }

    .continue-btn.ready:hover {
      background: var(--amber-glow);
      box-shadow: 0 0 18px var(--amber-glow);
      color: #e8c870;
    }

    /* ── footer ── */
    .mark {
      position: fixed;
      bottom: 1.8rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Instrument Serif', Georgia, serif;
      font-style: italic;
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      color: var(--text-dim);
      opacity: 0.35;
      white-space: nowrap;
    }

    /* ── count screen vs typeahead screen ── */
    .screen { display: none; flex-direction: column; align-items: center; width: 100%; }
    .screen.active { display: flex; }
  </style>

<body>

<div class="stage">
  <p class="eyebrow">gufa.Labs · devScan</p>

  <!-- SCREEN A: film count (shown only when ficount not in URL) -->
  <div class="screen" id="screenCount">
    <h1 class="headline">How many rolls today?</h1>
    <p class="subline">Enter a number between 1 and 9.</p>
    <div class="count-wrap">
      <input class="count-input" type="number" id="filmCountInput" min="1" max="9" placeholder="–" autocomplete="off" />
      <div class="count-nudge" id="countNudge">
        Big haul! For orders above 6, we'd suggest splitting by film type —
        one form for colour, one for black &amp; white. It keeps everything cleaner for both of us.
      </div>
    </div>
    <button class="continue-btn" id="countConfirmBtn">Let's pick the films</button>
  </div>

  <!-- SCREEN B: single typeahead (shown when ficount known) -->
  <div class="screen" id="screenFilm">
    <h1 class="headline" id="filmHeadline"></h1>
    <p class="subline" id="filmSubline"></p>
    <p class="film-pos" id="filmPos"></p>
    <div class="search-wrap">
      <input class="search-input" type="text" id="filmSearch" autocomplete="off" spellcheck="false" />
      <div class="dropdown" id="dropdown"></div>
    </div>
    <div class="selected-badge" id="selectedBadge"></div>
    <button class="continue-btn" id="continueBtn">Continue</button>
  </div>
</div>

<p class="mark">gufa.Labs · यहाँ प्रकाश जन्म लेता है</p>

    { m:'Zhenwei', f:'Kepler 400',        pro:'C41',  size:'35mm', price:900 },
    { m:'Zhenwei', f:'Kepler 800',        pro:'C41',  size:'35mm', price:900 },
    { m:'Zhenwei', f:'You-Name-It',       pro:'C41',  size:'35mm', price:900 },
    { m:'Zhenwei', f:'Sincity 1000',      pro:'C41',  size:'35mm', price:900 },
    // DISPOSABLES (all C41, all 35mm)
    { m:'Disposable Kodak',     f:'FunSaver 800',            pro:'C41', size:'35mm', price:900 },
    { m:'Disposable Fujifilm',  f:'QuickSnap 400',           pro:'C41', size:'35mm', price:900 },
    { m:'Disposable Fujifilm',  f:'QuickSnap Waterproof 800',pro:'C41', size:'35mm', price:900 },
    { m:'Disposable Ilford',    f:'HP5+ Single Use',         pro:'BNW', size:'35mm', price:600 },
    { m:'Disposable Ilford',    f:'XP2 Super Single Use',    pro:'C41', size:'35mm', price:900 },
    { m:'Disposable Harman',    f:'Reusable',                pro:'C41', size:'35mm', price:900 },
    { m:'Disposable Lomography',f:'Simple Use 400',          pro:'C41', size:'35mm', price:900 },
    { m:'Disposable Lomography',f:'Simple Use B&W',          pro:'BNW', size:'35mm', price:600 },
    { m:'Disposable Dubblefilm',f:'SHOW 400',                pro:'C41', size:'35mm', price:900 },
    { m:'Disposable AGFAPhoto', f:'LeBox Color 400',         pro:'C41', size:'35mm', price:900 },
    { m:'Disposable AGFAPhoto', f:'LeBox B&W',               pro:'BNW', size:'35mm', price:600 },
    // gufa FILMS (amber, Essence is free)
    { m:'gufa', f:'Essence 250',       pro:'C41', size:'35mm', price:0,    gufa:true },
    { m:'gufa', f:'Roasty Toasty 400', pro:'C41', size:'35mm', price:900,  gufa:true },
    { m:'gufa', f:'Cine Color 250',    pro:'ECN2',size:'35mm', price:900,  gufa:true },
    { m:'gufa', f:'Cine Color 500',    pro:'ECN2',size:'35mm', price:900,  gufa:true },
    { m:'gufa', f:'Cine Color 500T',   pro:'ECN2',size:'35mm', price:900,  gufa:true },
    { m:'gufa', f:'Cine Color 1000',   pro:'ECN2',size:'35mm', price:900,  gufa:true },
    { m:'gufa', f:'Where is my Mind',  pro:'BNW', size:'35mm', price:600,  gufa:true },
    { m:'gufa', f:'White Snow 125',    pro:'BNW', size:'35mm', price:600,  gufa:true },
    { m:'gufa', f:'Sol.64',            pro:'BNW', size:'35mm', price:600,  gufa:true },
    { m:'gufa', f:'Jadu Tona 200',     pro:'C41', size:'35mm', price:900,  gufa:true },
    { m:'gufa', f:'Jadu Tona 400',     pro:'C41', size:'35mm', price:900,  gufa:true },
    { m:'gufa', f:'Chandrama 2500',    pro:'BNW', size:'35mm', price:600,  gufa:true },
    // FILM DEALER (amber)
    { m:'Film Dealer', f:'Party Wolf',  pro:'C41', size:'35mm', price:900,  gufa:true },
  ];

  // Build FILMS array with display name + search string
  const FILMS = FILMS_RAW.map(e => {
    const isGufa = e.gufa === true;
    let display;
    if (e.m === 'gufa')        display = `gufa's ${e.f}`;
    else if (e.m === 'Film Dealer') display = `${e.f} (Film Dealer)`;
    else                       display = `${e.f} (${e.m})`;
    return {
      display,
      search: `${e.m} ${e.f}`.toLowerCase(),
      isGufa,
      pro:   e.pro,
      size:  e.size,
      price: e.price,
    };
  });

  // Fuse.js instance for fuzzy / tokenized searching
  const fuse = new Fuse(FILMS, {
    keys: ['display', 'search'],
    threshold: 0.28,             // 0.0 = exact, 1.0 = very fuzzy (tuned slightly less fuzzy)
    minMatchCharLength: 2,
    ignoreLocation: true,
    includeScore: true,
  });

  const FALLBACK = {
    display: 'not on the list?',
    search: 'not on the list',
    isGufa: false,
    isFallback: true,
    pro: '', size: '', price: 0,
  };

  // ── PLACEHOLDER POOL ─────────────────────────────────────────
  const PLACEHOLDERS = [
    'e.g. Kodak Gold, Disposable, Fuji...',
    'e.g. Essence 250, HP5+, Delta 100...',
    'e.g. Lazy 250, Kepler 800, Chandrama 2500...',
    'e.g. Revolog Aurora, FlicFilm, Orwo...',
    'e.g. Ilford XP2, PAN 400, Where is my mind...',
    'e.g. Ferrania, Adox, Bergger...',
    'e.g. Lomography Turquoise, Lady Grey 400...',
    'e.g. Phoenix, SFX, Superia...',
    'e.g. Ferrania, Adox, Bergger...',
  ];

  const randomPlaceholder = PLACEHOLDERS[Math.floor(Math.random() * PLACEHOLDERS.length)];

  // ── URL PARAMS ───────────────────────────────────────────────
  const urlParams = new URLSearchParams(window.location.search);
  const snum      = urlParams.get('snum')    || '';
  const sname     = urlParams.get('sname')   || '';
  const gfid      = urlParams.get('gfid')    || '';
  let   ficount   = parseInt(urlParams.get('ficount') || '0', 10);
  let   fiposn    = parseInt(urlParams.get('fiposn')  || '1', 10);

  const TALLY_URL = 'https://tally.so/r/rjWNDv';

  // ── DOM ──────────────────────────────────────────────────────
  const screenCount     = document.getElementById('screenCount');
  const screenFilm      = document.getElementById('screenFilm');
  const filmCountInput  = document.getElementById('filmCountInput');
  const countNudge      = document.getElementById('countNudge');
  const countConfirmBtn = document.getElementById('countConfirmBtn');
  const filmHeadline    = document.getElementById('filmHeadline');
  const filmSubline     = document.getElementById('filmSubline');
  const filmPos         = document.getElementById('filmPos');
  const filmSearch      = document.getElementById('filmSearch');
  const dropdown        = document.getElementById('dropdown');
  const selectedBadge   = document.getElementById('selectedBadge');
  const continueBtn     = document.getElementById('continueBtn');

  let selectedFilm  = null;
  let activeIndex   = -1;
  let currentItems  = [];

  // ── DECIDE WHICH SCREEN ──────────────────────────────────────
  if (ficount >= 1) {
    showFilmScreen();
  } else {
    screenCount.classList.add('active');
  }

  // ── COUNT SCREEN LOGIC ───────────────────────────────────────
  filmCountInput.addEventListener('input', () => {
    let val = parseInt(filmCountInput.value, 10);
    if (isNaN(val) || val < 1) val = 0;
    if (val > 9) { val = 9; filmCountInput.value = 9; }
    countNudge.classList.toggle('visible', val >= 7);
    countConfirmBtn.classList.toggle('ready', val >= 1);
  });

  countConfirmBtn.addEventListener('click', () => {
    const val = parseInt(filmCountInput.value, 10);
    if (!val || val < 1) return;
    ficount = val;
    fiposn  = 1;
    screenCount.classList.remove('active');
    showFilmScreen();
  });

  // ── FILM SCREEN SETUP ────────────────────────────────────────
  function showFilmScreen() {
    const ordinals = ['first','second','third','fourth','fifth','sixth','seventh','eighth','ninth'];
    const ordinal  = ordinals[(fiposn - 1)] || `#${fiposn}`;

    const headlines = [
      'Which film are we feeding the cave today?',
      'And the second roll — what is it?',
      'Third one — keep going.',
      'The fourth film, what shall it be?',
      'Almost there — the fifth roll?',
      'Sixth — what are we developing?',
      'The seventh roll, go on.',
      'Eight films — what is the next one?',
      'Last one — the ninth roll!',
    ];

    filmHeadline.textContent = headlines[fiposn - 1] || `Film ${fiposn} — what is it?`;

    filmSubline.textContent = ficount > 1
      ? `Roll ${fiposn} of ${ficount} — the ${ordinal} one.`
      : 'Start typing — the name, the make, anything.';

    filmPos.textContent = ficount > 1
      ? `film ${fiposn} · of ${ficount}`
      : '';

    filmSearch.placeholder = randomPlaceholder;
    screenFilm.classList.add('active');
    filmSearch.focus();
  }

  // ── HELPERS ──────────────────────────────────────────────────
  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function highlight(text, query) {
    if (!query) return escapeHtml(text);
    const idx = text.toLowerCase().indexOf(query.toLowerCase());
    if (idx === -1) return escapeHtml(text);
    return (
      escapeHtml(text.slice(0, idx)) +
      `<span class="match-highlight">${escapeHtml(text.slice(idx, idx + query.length))}</span>` +
      escapeHtml(text.slice(idx + query.length))
    );
  }

  // Debounce helper to limit how often expensive work runs as the user types
  function debounce(fn, wait) {
    let t;
    return (...args) => {
      clearTimeout(t);
      t = setTimeout(() => fn(...args), wait);
    };
  }

  // ── TYPEAHEAD ────────────────────────────────────────────────
  function openDropdown(query) {
    const q = query.trim().toLowerCase();
    if (!q) { closeDropdown(); return; }
    // Use Fuse.js fuzzy/tokenized search for better matching of partial and typo'd queries
    const results = fuse.search(q, { limit: 40 }).map(r => r.item);
    currentItems = results.length ? results : [FALLBACK];
    dropdown.innerHTML = '';
    activeIndex = -1;
    currentItems.forEach((film, i) => {
      const div = document.createElement('div');
      div.className = 'dropdown-item' +
        (film.isGufa     ? ' gufa-item'    : '') +
        (film.isFallback ? ' fallback-item' : '');
      div.innerHTML = `<span>${film.isFallback ? film.display : highlight(film.display, query.trim())}</span>`;
      div.addEventListener('mousedown', e => { e.preventDefault(); selectFilm(film); });
      dropdown.appendChild(div);
    });
    dropdown.classList.add('open');
  }

  function closeDropdown() {
    dropdown.classList.remove('open');
    dropdown.innerHTML = '';
    currentItems = [];
    activeIndex  = -1;
  }

  function selectFilm(film) {
    selectedFilm = film;
    filmSearch.value = film.display;
    closeDropdown();
    selectedBadge.textContent = film.isFallback
      ? '✦ we\'ll figure it out together'
      : `✦ ${film.display} — selected`;
    selectedBadge.classList.add('visible');
    continueBtn.classList.add('ready');
    continueBtn.textContent = fiposn < ficount ? 'Continue' : 'Done — review order';
  }

  const handleFilmInput = debounce(() => {
    selectedFilm = null;
    selectedBadge.classList.remove('visible');
    continueBtn.classList.remove('ready');
    openDropdown(filmSearch.value);
  }, 200);
  filmSearch.addEventListener('input', handleFilmInput);

  filmSearch.addEventListener('focus', () => {
    if (filmSearch.value && !selectedFilm) openDropdown(filmSearch.value);
  });

  filmSearch.addEventListener('keydown', e => {
    if (!dropdown.classList.contains('open')) return;
    const items = dropdown.querySelectorAll('.dropdown-item');
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      activeIndex = Math.min(activeIndex + 1, items.length - 1);
      items.forEach((el, i) => el.classList.toggle('active', i === activeIndex));
      if (items[activeIndex]) items[activeIndex].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      activeIndex = Math.max(activeIndex - 1, 0);
      items.forEach((el, i) => el.classList.toggle('active', i === activeIndex));
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (activeIndex >= 0 && currentItems[activeIndex]) {
        selectFilm(currentItems[activeIndex]);
      } else if (selectedFilm) {
        continueBtn.click();
      }
    } else if (e.key === 'Escape') {
      closeDropdown();
    }
  });

  document.addEventListener('click', e => {
    if (!e.target.closest('.search-wrap')) closeDropdown();
  });

  // ── CONTINUE ────────────────────────────────────────────────
  continueBtn.addEventListener('click', () => {
    if (!selectedFilm) return;
    const mcartIn = urlParams.get('mcart') || '0';
    const params = new URLSearchParams();
    params.set('sfilm',   selectedFilm.display);
    params.set('fipro',   selectedFilm.pro   || '');
    params.set('fisize',  selectedFilm.size  || '');
    params.set('1cart',   selectedFilm.price);
    params.set('mcart',   mcartIn);
    params.set('ficount', ficount);
    params.set('fiposn',  fiposn);
    if (snum)  params.set('snum',  snum);
    if (sname) params.set('sname', sname);
    if (gfid)  params.set('gfid',  gfid);
    const fullUrl = `${TALLY_URL}?${params.toString()}`;
    // Use replace so navigation feels immediate and avoids an extra history entry
    window.location.replace(fullUrl);
  });
</script>
</body>
